<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Hello, world!</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="" />
        <link
            href="https://cdn.jsdelivr.net/npm/modern-normalize@v3.0.1
/modern-normalize.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="style.css" />
    </head>
    <body>
        <header class="header">
            <div class="container">
                <h1>Library i guess</h1>
                <button id="showFormBtn" class="addBtn">New Book</button>
            </div>
        </header>

        <main>
            <div class="stats">
                <h1>INFO or Stats</h1>
                <p>
                    Here some info should appear like total books read, books
                    not read yet, totla pages read
                </p>
            </div>
            <div class="bookGrid" id="bookGrid">
                <div>
                    <p>Empty or something</p>
                </div>
                <div>
                    <p>Empty or something</p>
                </div>
                <div>
                    <p>Empty or something</p>
                </div>
                <div>
                    <p>Empty or something</p>
                </div>
                <div>
                    <p>Empty or something</p>
                </div>
            </div>
        </main>

        <!-- From Uiverse.io by satyamchaudharydev -->
        <div id="newBookForm" class="newBook">
            <div class="card">
                <span class="card_title">Add New Book</span>
                <div class="card__form">
                    <input
                        placeholder="Book Title"
                        type="text"
                        id="bookTitle"
                    />
                    <input
                        placeholder="Book Author"
                        type="text"
                        id="bookAuthor"
                    />
                    <input
                        placeholder="Book Pages"
                        type="number"
                        id="bookPages"
                    />

                    <div class="isRead">
                        <label for="alreadyRead">Already Read?</label>
                        <input
                            type="checkbox"
                            id="alreadyRead"
                            class="checkbox"
                        />
                    </div>
                    <button class="addBook">Add Book</button>
                    <button class="cancelBook" id="closeFormBtn">Cancel</button>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
